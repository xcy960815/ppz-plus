name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      # node:24-bookworm 容器内没有 git，checkout 之前先安装
      - name: 安装 git 与 Electron 运行库
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git xvfb libgtk-3-0 libnss3 libasound2 libgbm1 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libpango-1.0-0 libcairo2

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc -p ./ --noEmit

      - name: 代码规范检查
        run: pnpm lint

      - name: 单元测试
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a pnpm test 2>&1 | tee /tmp/test-output.log
          exit "${PIPESTATUS[0]}"

      - name: 失败时输出失败用例详情
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            let data;
            try {
              data = JSON.parse(fs.readFileSync("/tmp/mocha-report.json", "utf8"));
            } catch (error) {
              console.error("::error::mocha 结果文件读取/解析失败: " + error.message);
              process.exit(0);
            }
            const stats = data.stats || {};
            console.error(`::error::通过 ${stats.passes ?? "?"} / 失败 ${stats.failures ?? "?"}`);
            for (const failure of (data.failures || []).slice(0, 10)) {
              const title = failure.fullTitle || failure.title || "未知用例";
              const message = (failure.err && failure.err.message) || "";
              console.error(`::error::${title.slice(0, 200)} :: ${message.slice(0, 300).replace(/\n/g, " ")}`);
            }
          '
