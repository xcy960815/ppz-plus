name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      # node:24-bookworm 容器内没有 git，checkout 之前先安装
      - name: 安装 git 与 Electron 运行库
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git xvfb libgtk-3-0 libnss3 libasound2 libgbm1 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libpango-1.0-0 libcairo2

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc -p ./ --noEmit

      - name: 代码规范检查
        run: pnpm lint

      - name: 单元测试
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a pnpm test 2>&1 | tee /tmp/test-output.log
          exit "${PIPESTATUS[0]}"

      - name: 上传测试诊断文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            /tmp/mocha-report.json
            /tmp/test-output.log
          if-no-files-found: warn
          retention-days: 7

      - name: 失败时输出诊断内容
        if: failure()
        run: |
          echo "::error::TZ=${TZ:-unset} ARCH=$(uname -m) NODE=$(node -v) PWD=$(pwd)"
          ls -la /tmp | head -4 | while IFS= read -r line; do echo "::error::TMP ${line:0:200}"; done
          if [ -f /tmp/mocha-report.json ]; then
            node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("/tmp/mocha-report.json", "utf8"));
              const stats = data.stats || {};
              console.error(`::error::通过 ${stats.passes} / 失败 ${stats.failures}`);
              for (const failure of (data.failures || []).slice(0, 6)) {
                const title = failure.fullTitle || failure.title || "未知用例";
                const message = (failure.err && failure.err.message) || "";
                console.error(`::error::${title.slice(0, 180)} :: ${message.slice(0, 250).replace(/\n/g, " ")}`);
              }
            '
          fi
          if [ -f /tmp/test-output.log ]; then
            head -8 /tmp/test-output.log | while IFS= read -r line; do echo "::error::LOG ${line:0:300}"; done
          fi
